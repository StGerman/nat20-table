[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/StGerman/nat20-table"

[workspace.dependencies]
nat20-api-contract = { path = "crates/nat20-api-contract" }
# Pinned by rev. Bump only in its own PR with the full suite green (CLAUDE.md Rule 5).
# cac1cc5 = fork branch `demo`: upstream 9aaca2f plus Leather Armor, the Goblin Warrior's
# shield stopgap effect (both needed until our content overlay exists), U2 seedable dice
# (`components::rng`, plus initiative rolled in a fixed order) and U1 `NAT20_REGISTRY_ROOT`.
nat20_core = { git = "https://github.com/StGerman/nat20", rev = "cac1cc5d0ee0500fdf7cdfa920905fc29774c64a" }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Copied verbatim from upstream nat20's workspace. Cargo ignores a dependency's [patch],
# so without this nat20_core resolves crates.io polyanya instead of the patched branch.
[patch.crates-io]
polyanya = { git = "https://github.com/MadsWedendahlKruse/polyanya", branch = "fix-path-with-height-oob" }

[profile.dev.package."*"]
opt-level = 3
