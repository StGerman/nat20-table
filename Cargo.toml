[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/StGerman/nat20-table"
# Never published to crates.io; also lets cargo-deny accept our path dependencies.
publish = false

[workspace.dependencies]
nat20-api-contract = { path = "crates/nat20-api-contract" }
# Pinned by rev. Bump only in its own PR with the full suite green (CLAUDE.md Rule 5).
# b63b2bb = core #13 (crates.io polyanya 0.16.0 in place of the git patch, UPS-11) on top
# of fork branch `demo` 031f7a2: upstream 9aaca2f plus Leather Armor, the Goblin Warrior's
# shield stopgap effect (both needed until our content overlay exists), U2 seedable dice
# (`components::rng`, plus initiative rolled in a fixed order), U1 `NAT20_REGISTRY_ROOT`,
# U4 Hit Point Dice spent on a short rest (core #3), a natural 20 or 1 deciding only
# attack rolls and death saves (core #4), U5 surprised creatures rolling Initiative
# with Disadvantage (core #5), U7 creatures joining a running encounter (core #6),
# U6 the Help action: assist a check, assist an attack, stabilize (core #7),
# Tactical Mind turning a failed check into a success (core #8), damage to a Stable
# creature counting as a failed death save (core #9) and effects tied to a turn ending on
# creatures outside the fight (core #10).
nat20_core = { git = "https://github.com/StGerman/nat20", rev = "b63b2bba83efea5b2aa4b0741768e69f61687d2e" }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[profile.dev.package."*"]
opt-level = 3
