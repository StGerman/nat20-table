[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/StGerman/nat20-table"
# Never published to crates.io; also lets cargo-deny accept our path dependencies.
publish = false

[workspace.dependencies]
nat20-api-contract = { path = "crates/nat20-api-contract" }
# Pinned by rev. Bump only in its own PR with the full suite green (CLAUDE.md Rule 5).
# 9d70516 = head of open core #18 (Heavy armour ignores a negative Dexterity modifier), stacked
# on core #16 (Cleric) and core #15 (partial recharge), all on fork `demo` 0478492: it adds
# Second Wind's and Rage's one use back on a short rest, the Cleric levels 1 and 2, and the
# Milestone 4 Cleric spells. Repointed to `demo`'s tip once they merge.
nat20_core = { git = "https://github.com/StGerman/nat20", rev = "9d705160a5819ca6886d089fdb3d81c43d7e02fd" }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Dependencies (nat20_core included) build at opt-level 1, not 3: a cold `cargo test --no-run`
# drops from 243 s to 176 s on 4 cores while the test suite stays at about 8 s. opt-level 0 builds
# in 80 s but the suite takes 58 s.
[profile.dev.package."*"]
opt-level = 1
