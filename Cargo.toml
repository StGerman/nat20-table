[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/StGerman/nat20-table"
# Never published to crates.io; also lets cargo-deny accept our path dependencies.
publish = false

[workspace.dependencies]
nat20-api-contract = { path = "crates/nat20-api-contract" }
# Pinned by rev. Bump only in its own PR with the full suite green (CLAUDE.md Rule 5).
# c17c4bd = fork `demo` after core #14 to #20: Second Wind's and Rage's one use back on a
# short rest, the Cleric levels 1 and 2 with the Milestone 4 Cleric spells, and heavy armour
# ignoring a negative Dexterity modifier. 6c1edb4 = c17c4bd plus core #21, which re-exports
# hecs, parry3d, rerecast and uom; the adapter names them through `nat20_core::<crate>`.
# de1e670 = 6c1edb4 plus core #23 (Rust 1.99.1), core #24 (cargo patch updates, lockfile only),
# core #30 (rand 0.10), core #32 (Dependabot config), core #22 (concentration ends when the
# spell's effects run out), core #28 (uom 0.38), core #29 (rhai 1.26.1), core #34 (mlua 0.12.2)
# and core #35 (rstest 0.27). 7e715dd = demo 4132e20 (de1e670 plus core #38 strum 0.28, core #39,
# #40 and #41, config and lockfile only) plus core #43 (Potion of Healing, a consumable item),
# the head of that open PR until it merges. 3145e32 = demo e9ade31 (core #43 merged, core #42
# hecs 0.11.2, core #44 fractional challenge rating) plus core #49 (unarmoured Armor Class counts
# the Dexterity modifier), the head of that open PR until it merges. 9823766 = demo e9ade31
# plus core #45 to #50 (Milestone 5: monster registry, Goblin Boss, Wolf, Giant Rat, Advantage
# cancelling, Prone, monster traits) and #49, core #50's head until the stack merges. a206929 =
# 9823766 plus core #51 (Dragonborn Breath Weapon) and #52 (event sequence across both logs),
# core #52's head until the stack merges. 935d516 = a206929 plus core #53 (a natural 20 on a
# Death Saving Throw restores 1 Hit Point and the creature takes its turn), core #53's head until
# the stack merges. d33118b = fork `demo` after core #45 to #53 merged; its tree is 935d516's.
# d9c6b37 = d33118b plus core #54 (a walk into range ends on a free spot, ENG-12).
# 1ac0a59 = demo d7df872 (core #55, README only) plus core #56 (a move an opportunity attack
# stops ends on a free spot, ENG-18), core #56's head until it merges.
# 59bc67b = fork `demo` after core #56 merged; its tree is 1ac0a59's.
nat20_core = { git = "https://github.com/StGerman/nat20", rev = "2fa403e1849c5ede61c04b507855d4bd9a93b692" }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Dependencies (nat20_core included) build at opt-level 1, not 3: a cold `cargo test --no-run`
# drops from 243 s to 176 s on 4 cores while the test suite stays at about 8 s. opt-level 0 builds
# in 80 s but the suite takes 58 s.
[profile.dev.package."*"]
opt-level = 1
