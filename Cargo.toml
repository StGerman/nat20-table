[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/StGerman/nat20-table"
# Never published to crates.io; also lets cargo-deny accept our path dependencies.
publish = false

[workspace.dependencies]
nat20-api-contract = { path = "crates/nat20-api-contract" }
# Pinned by rev. Bump only in its own PR with the full suite green (CLAUDE.md Rule 5).
# 0478492 = fork branch `demo` (upstream main plus our core changes; see the fork's history):
# since 031f7a2 it adds the Human species, Savage Attacker, Skilled and the SRD background
# lists (core #12), Shield and Mace (core #11), and crates.io polyanya 0.16 (core #13).
nat20_core = { git = "https://github.com/StGerman/nat20", rev = "0478492157d135cfd9e8e6c2fe21f05534ebc5b0" }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[profile.dev.package."*"]
opt-level = 3
