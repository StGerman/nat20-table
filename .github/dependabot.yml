# Weekly grouped update PRs. CI is the gate: a bump that changes generated TS, fixture output or
# licences fails contract-fresh, rust-lint, rust-test or deny like any other PR.
#
# Cooldown (decision 0024): 3 days after a patch release, 7 after a minor or major one. Security
# updates skip it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # Pinned by rev to fork branch demo; bumped only in its own PR (Rule 5). core-drift watches it.
      - dependency-name: nat20_core
    groups:
      # Patch only: Dependabot reads a 0.x minor (a breaking bump under Cargo semver) as minor, so
      # every cargo minor gets its own PR (CLAUDE.md Rule 9).
      cargo-patch:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # Types follow the Node major in .nvmrc; newer majors describe APIs CI's Node does not have.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Actions have no semver levels for Dependabot, so one wait covers every bump.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # rust-toolchain.toml: each new stable release becomes its own PR, with any lint fixes it needs.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
