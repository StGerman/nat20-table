# Non-blocking early warnings on main: never a PR check (design §5.3, decision 0022).
name: weekly

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Builds and tests against the head of fork branch `demo` instead of the pinned rev. Red here means
  # the next pin bump (Rule 5) will need adapter work; nothing is pushed or bumped automatically.
  core-drift:
    name: core-drift
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: core-drift
      - name: Point nat20_core at fork branch demo
        run: |
          pinned=$(grep -oP 'nat20_core = \{ git = "https://github.com/StGerman/nat20", rev = "\K[0-9a-f]+' Cargo.toml)
          sed -i -E 's|(nat20_core = \{ git = "https://github.com/StGerman/nat20", )rev = "[0-9a-f]+"|\1branch = "demo"|' Cargo.toml
          cargo update -p nat20_core
          head=$(grep -A2 'name = "nat20_core"' Cargo.lock | grep -oP 'source = ".*#\K[0-9a-f]+')
          echo "Pinned rev: $pinned" >> "$GITHUB_STEP_SUMMARY"
          echo "demo HEAD:  $head" >> "$GITHUB_STEP_SUMMARY"
          # Cargo.lock records a branch source by its short hash.
          if [ "${pinned#"$head"}" != "$pinned" ]; then echo "demo has not moved since the pin." >> "$GITHUB_STEP_SUMMARY"; fi
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
