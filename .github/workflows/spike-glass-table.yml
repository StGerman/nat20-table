# The Glass Table spike (CON-20): builds the spike's Swift Mac app on a hosted Apple Silicon machine,
# signs it ad-hoc under the hardened runtime with the compiled host and the engine inside it, and
# launches it, so a build error is found here and not on Stas's evening at the Mac. Calls no model
# (NAT20_SPIKE_NO_MODEL=1) and signs with no secret; the ChatGPT sign-in, the live call, the
# Developer ID and notarisation are checked on his Mac. Not part of ci-ok.
name: spike-glass-table

on:
  pull_request:
    paths:
      - .github/workflows/spike-glass-table.yml
      - game/spike/glass-table/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-glass-table-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    # The Xcode 27 image (a preview label): what Stas's Mac runs.
    name: spike (darwin-arm64, ad-hoc)
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      NAT20_SPIKE_NO_MODEL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust release pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: brew install xcodegen
      - name: Build, sign ad-hoc, launch through Launch Services twice, print the reports
        run: game/spike/glass-table/run.sh
      # Round A is the first report: the host signed with its entitlements. Round B, with none, is
      # read by a person. No ChatGPT account here: item 3 checks only the loopback callback and item 4
      # is skipped, so item 4 fails by design. The app must not have been handed this step's own PATH:
      # a double-clicked app has no shell PATH. Item 6: its window closed and it went on (decision 0100).
      - name: Every item but the live call works, with no shell PATH, and the app outlives its window
        run: |
          reports="$HOME/Library/Application Support/glass-table-spike"
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const bad = r.items.filter((i) => !i.ok && !i.id.startsWith("4 "));
            if (!r.items.some((i) => i.id.startsWith("6 "))) bad.push({ id: "6", detail: "missing from the report" });
            for (const i of bad) console.log("FAIL", i.id, i.detail);
            const first = r.items.find((i) => i.id.startsWith("1 "));
            const path = (first.detail.match(/PATH=(.*)$/) || [])[1] || "";
            console.log("the app was given PATH=" + path);
            const shell = /homebrew|hostedtoolcache|\.cargo/.test(path);
            if (shell) console.log("FAIL the app was given a shell PATH");
            process.exit(bad.length || shell ? 1 : 0);
          ' "$(ls "$reports"/report-*.json | sort | head -1)"
          # The host and the engine it keeps running have to be there when the app is killed, and gone after.
          if grep -E "LEFT BEHIND|MISSING before" "$reports"/spike-*.log; then
            echo "FAIL the host or the engine was not running before the app was killed, or outlived it"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-glass-table
          path: ~/Library/Application Support/glass-table-spike
          retention-days: 7
