# Blocking checks for every PR and every push to main. Job names match CLAUDE.md and design §5.3;
# why the jobs are shaped this way is in docs/decisions/0022-ci-shape.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  contract-fresh:
    name: contract-fresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: contract
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gen
      - name: Generated files match the contract crate
        run: |
          changed=$(git status --porcelain -- generated packages/engine-client/src/generated)
          if [ -n "$changed" ]; then
            echo "::error::Generated files are stale or hand-edited. Run 'npm run gen' and commit the result."
            echo "$changed"
            git diff -- generated packages/engine-client/src/generated
            exit 1
          fi

  contract-compat:
    name: contract-compat
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: No breaking change without a major bump (Rule 2)
        run: node tools/codegen/check-breaking.mjs --base "origin/${{ github.base_ref }}"

  contract-pure:
    name: contract-pure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Contract crate depends only on serde, serde_json, schemars (Rule 1)
        run: |
          extra=$(cargo tree --locked -p nat20-api-contract --edges normal,build --depth 1 --prefix none \
            | tail -n +2 | awk '{print $1}' | sort -u | grep -vxE 'serde|serde_json|schemars' || true)
          if [ -n "$extra" ]; then
            echo "::error::nat20-api-contract has extra dependencies: $extra"
            exit 1
          fi

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests, conformance fixture replay, visibility scan
        run: cargo test --locked --workspace --all-features
      - name: Docs build without warnings
        run: cargo doc --locked --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      # The ts and visibility jobs reuse these binaries instead of building the workspace again.
      - name: Collect the engine and the visibility scan binaries
        run: |
          mkdir -p dist
          cp target/debug/nat20-api-server dist/
          scan=$(cargo test --locked -p nat20-api-server --test visibility --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "visibility") | .executable')
          cp "$scan" dist/visibility
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-debug
          path: dist/
          retention-days: 3
          if-no-files-found: error

  visibility:
    name: visibility
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
          save-if: false
      # The binaries read nat20_core's registries from its cargo checkout at run time.
      - run: cargo fetch --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-debug
          path: dist
      - name: Replay every fixture as each player viewer and scan for hidden data
        run: chmod +x dist/visibility && dist/visibility

  ts:
    name: ts
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust
          save-if: false
      - run: cargo fetch --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-debug
          path: dist
      - name: Place the engine where the client tests expect it
        run: mkdir -p target/debug && install -m 755 dist/nat20-api-server target/debug/nat20-api-server
      - run: npm run check:ts

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Licences (Rule 7), bans and dependency sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

  # Not a required check: a new RustSec advisory can land on any day, unrelated to the PR.
  # The weekly workflow runs the same check on main.
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
