# Blocking checks for every PR and every push to main. Job names match CLAUDE.md and design §5.3;
# why the jobs are shaped this way is in docs/decisions/0022-ci-shape.md.
#
#   changes ─┬─ contract-fresh                      contract-compat (PR only)
#            ├─ rust-lint                           contract-pure
#            └─ rust-test ─┬─ visibility            deny
#                          └─ ts                    advisories (not gating)
#   every gating job ── ci-ok   (the one required check)
#
# Only real data dependencies are edges: visibility and ts run the binaries rust-test built, and
# every job but deny and advisories reads its runner from `changes`.
# `changes` skips the build jobs on a PR that touches only Markdown and docs/, and picks that runner
# (decision 0028): the self-hosted arm64 runner named by the repo variable CI_RUNNER, except for
# PRs from forks and Dependabot PRs, which stay on GitHub-hosted runners. With CI_COLD_HOSTED set to true (a slow box
# such as a Raspberry Pi), PRs that change Cargo.lock or rust-toolchain.toml (cold builds) stay
# hosted too. CI_RUNNER unset means everything runs GitHub-hosted.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info only slows the build and bloats the cache here; panics still name file and line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: changes
    runs-on: ${{ vars.CI_RUNNER != '' && github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      runner: ${{ steps.runner.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        name: Does the change touch anything but Markdown and docs/?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # --no-renames: a moved file counts at both paths, so moving code into docs/ still builds.
          code=$(git diff --name-only --no-renames "origin/$BASE...HEAD" | grep -vE '^docs/|\.md$' || true)
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"
          echo "Files outside Markdown and docs/:"; echo "${code:-(none)}"
      - id: runner
        name: Which runner do the other jobs use?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          CI_RUNNER: ${{ vars.CI_RUNNER }}
          COLD_HOSTED: ${{ vars.CI_COLD_HOSTED }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # A JSON value for fromJSON: a label list such as ["self-hosted","nat20"], or "ubuntu-latest".
          runner='"ubuntu-latest"'
          if [ -z "$CI_RUNNER" ]; then
            echo "CI_RUNNER is not set: GitHub-hosted."
          elif [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" != "$REPO" ]; then
            echo "PR from a fork: GitHub-hosted. The repo is public, so outside code never runs on the self-hosted box."
          elif [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: GitHub-hosted, so new dependency build scripts never run on the self-hosted box."
          elif [ "$COLD_HOSTED" = "true" ] && [ "$EVENT" = "pull_request" ] && git diff --name-only "origin/$BASE...HEAD" | grep -qxE 'Cargo\.lock|rust-toolchain\.toml'; then
            echo "Cargo.lock or rust-toolchain.toml changed: cold build, GitHub-hosted."
          else
            runner="$CI_RUNNER"; echo "Self-hosted: $runner"
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  contract-fresh:
    name: contract-fresh
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.changes.outputs.runner && fromJSON(needs.changes.outputs.runner) || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust release pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: contract
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gen
      - name: Generated files match the contract crate
        run: |
          changed=$(git status --porcelain -- generated packages/engine-client/src/generated)
          if [ -n "$changed" ]; then
            echo "::error::Generated files are stale or hand-edited. Run 'npm run gen' and commit the result."
            echo "$changed"
            git diff -- generated packages/engine-client/src/generated
            exit 1
          fi

  contract-compat:
    name: contract-compat
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ${{ needs.changes.outputs.runner && fromJSON(needs.changes.outputs.runner) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: No breaking change without a major bump (Rule 2)
        run: node tools/codegen/check-breaking.mjs --base "origin/${{ github.base_ref }}"

  contract-pure:
    name: contract-pure
    needs: changes
    runs-on: ${{ needs.changes.outputs.runner && fromJSON(needs.changes.outputs.runner) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust release pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Contract crate depends only on serde, serde_json, schemars (Rule 1)
        run: |
          extra=$(cargo tree --locked -p nat20-api-contract --edges normal,build --depth 1 --prefix none \
            | tail -n +2 | awk '{print $1}' | sort -u | grep -vxE 'serde|serde_json|schemars' || true)
          if [ -n "$extra" ]; then
            echo "::error::nat20-api-contract has extra dependencies: $extra"
            exit 1
          fi

  # Check-only build (no codegen): fmt, clippy, then docs reuse clippy's dependency metadata.
  rust-lint:
    name: rust-lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.changes.outputs.runner && fromJSON(needs.changes.outputs.runner) || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust release pinned in rust-toolchain.toml
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Docs build without warnings
        run: cargo doc --locked --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # Full build: the only job that compiles the workspace to binaries. visibility and ts reuse them.
  rust-test:
    name: rust-test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.changes.outputs.runner && fromJSON(needs.changes.outputs.runner) || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust release pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build tests and the engine
        run: cargo test --locked --workspace --all-features --no-run
      - name: Tests, conformance fixture replay, visibility scan
        run: cargo test --locked --workspace --all-features
      - name: Collect the engine, the visibility scan and core's registries
        run: |
          mkdir -p dist
          cp "${CARGO_TARGET_DIR:-target}/debug/nat20-api-server" dist/
          scan=$(cargo test --locked -p nat20-api-server --test visibility --all-features --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "visibility") | .executable')
          cp "$scan" dist/visibility
          # The binaries find core's registries through NAT20_REGISTRY_ROOT (upstream item U1), so
          # downstream jobs need neither a Rust toolchain nor cargo's git checkout.
          core=$(cargo metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "nat20_core") | .manifest_path')
          cp -r "$(dirname "$core")/../assets/registries" dist/registries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-debug
          path: dist/
          retention-days: 3
          if-no-files-found: error

  visibility:
    name: visibility
    needs: [changes, rust-test]
    runs-on: ${{ needs.changes.outputs.runner && fromJSON(needs.changes.outputs.runner) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # The scan reads contract/fixtures and the server's scene data from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-debug
          path: dist
      - name: Replay every fixture as each player viewer and scan for hidden data
        run: chmod +x dist/visibility && dist/visibility
        env:
          NAT20_REGISTRY_ROOT: ${{ github.workspace }}/dist/registries

  ts:
    name: ts
    needs: [changes, rust-test]
    runs-on: ${{ needs.changes.outputs.runner && fromJSON(needs.changes.outputs.runner) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-debug
          path: dist
      - run: chmod +x dist/nat20-api-server && npm run check:ts
        env:
          NAT20_API_SERVER: ${{ github.workspace }}/dist/nat20-api-server
          NAT20_REGISTRY_ROOT: ${{ github.workspace }}/dist/registries

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Licences (Rule 7), bans and dependency sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

  # Not gating: a new RustSec advisory can land on any day, unrelated to the PR.
  # The daily workflow runs the same check on main.
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # The only check branch protection needs: green when every gating job passed or was skipped
  # on purpose (docs-only PR, contract-compat on push). Adding or splitting jobs never touches
  # repo settings.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, contract-fresh, contract-compat, contract-pure, rust-lint, rust-test, visibility, ts, deny]
    runs-on: ${{ needs.changes.outputs.runner && fromJSON(needs.changes.outputs.runner) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Every gating job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
