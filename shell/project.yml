# The SwiftUI shell (decision 0093): a SwiftUI program around the page (game/src/page) in a web view.
# No Xcode project is committed: `xcodegen generate` writes it from this file.
name: GlassTable
options:
  bundleIdPrefix: dev.nat20
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
# Signing for a real phone: Signing.xcconfig, and your own team in Local.xcconfig (not committed).
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    # The app's name (Stas, 2026-11-22): Fine Print, «Мелкий шрифт» in Russian (Shared/Names). These two
    # lines and Shared/Names are the only places it is written. The target, the scheme and the project
    # keep the working name `GlassTable`, which nobody sees.
    APP_NAME: Fine Print
    APP_BUNDLE_ID: dev.nat20.fineprint
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GlassTable:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
        excludes:
          - Info.plist
      # The built page (`npm run page:build`), copied whole as `page/`.
      - path: ../game/dist/page
        type: folder
        buildPhase: resources
      # Recorded runs, for a table with no host.
      - path: ../game/test/fixtures/yard.seat-wire.jsonl
        buildPhase: resources
      - path: ../game/test/fixtures/the-way-back-ru.seat-wire.jsonl
        buildPhase: resources
      - path: ../game/test/fixtures/green.seat-wire.jsonl
        buildPhase: resources
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: $(APP_NAME) connects to the table running on your Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        # The keycap with the F (decision 0103): Shared/Assets.xcassets, a light and a dark one.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - GlassTableTour
  # A finger's tour of a live table (Tour/Tour.swift), run by ci/tour.sh.
  GlassTableTour:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tour
    dependencies:
      - target: GlassTable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tour
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GlassTable
  # The same shell on the Mac (CON-23): the shared model and controls in a window, with a menu bar.
  GlassTableMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Mac
        excludes:
          - Info.plist
      - path: ../game/dist/page
        type: folder
        buildPhase: resources
      - path: ../game/test/fixtures/yard.seat-wire.jsonl
        buildPhase: resources
      - path: ../game/test/fixtures/the-way-back-ru.seat-wire.jsonl
        buildPhase: resources
      - path: ../game/test/fixtures/green.seat-wire.jsonl
        buildPhase: resources
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        LSApplicationCategoryType: public.app-category.role-playing-games
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: $(APP_NAME) connects to the table running on a Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signed to run on the Mac that built it. A signed, notarised app is CON-21.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets:
        - GlassTableMacTour
  # The menu bar's tour of a live table (MacTour/MacTour.swift), run by ci/mac-tour.sh.
  GlassTableMacTour:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MacTour
    dependencies:
      - target: GlassTableMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).mactour
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GlassTableMac
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
