[package]
name = "nat20-api-server"
version = "0.1.0"
description = "The nat20-table engine: serves the contract in nat20-api-contract over stdio JSON-lines, backed by nat20_core."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nat20-api-contract = { workspace = true }
nat20_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Versions match what nat20_core uses, so the adapter can name its types.
hecs = { version = "0.11.2", features = ["std", "macros", "serde"] }
parry3d = { version = "0.24", features = ["serde-serialize"] }
rerecast = { version = "0.2.0", features = ["serialize"] }
uom = { version = "0.37.0", features = ["f32", "serde"] }

[lib]
name = "nat20_api_server"
path = "src/lib.rs"

[[bin]]
name = "nat20-api-server"
path = "src/main.rs"
