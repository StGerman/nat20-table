[package]
name = "nat20-duel"
version = "0.1.0"
description = "Milestone 1 harness (a scripted Fighter vs Goblin Warrior duel through the engine API), the transcript audit, and the audit and leak scan of a game run (nat20-audit)."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# `cargo run -p nat20-duel` still runs the duel, as CLAUDE.md's fixture command expects.
default-run = "nat20-duel"

[dependencies]
nat20-api-contract = { workspace = true }
nat20-api-server = { path = "../nat20-api-server" }
serde = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "nat20_duel"
path = "src/lib.rs"

[[bin]]
name = "nat20-duel"
path = "src/bin/duel.rs"

[[bin]]
name = "nat20-audit"
path = "src/bin/audit.rs"
